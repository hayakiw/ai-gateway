services:
  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
    env_file:
      - ../.env
    volumes:
      - ../app:/app/app
      - ../tests:/app/tests
      - ../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  redis-data:
